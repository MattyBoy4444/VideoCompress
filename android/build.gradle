group 'com.example.video_compress'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

def isBuiltInKotlin() {
    try {
        def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
        return agpMajor >= 9 && project.findProperty('android.builtInKotlin')?.toString() != 'false'
    } catch (Throwable ignored) {
        return project.findProperty('android.builtInKotlin')?.toString() == 'true'
    }
}

if (!isBuiltInKotlin()) {
    project.pluginManager.apply('org.jetbrains.kotlin.android')
}

android {
    namespace 'com.example.video_compress'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdk 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lint {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation 'com.otaliastudios:transcoder:0.11.2'
}

